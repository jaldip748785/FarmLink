{% extends "base_admin.html" %}

{% block title %}Edit Product | Admin | FarmLink{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-warning text-dark py-3 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-pencil-square me-2"></i>
                        Edit Product #{{ product.id }} - {{ product.title }}
                    </h4>
                    <a href="{{ url_for('admin.products') }}" class="btn btn-outline-dark btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back to Products
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.edit_product', product_id=product.id) }}" enctype="multipart/form-data">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Product Title / Name</label>
                                <input type="text" class="form-control" name="title" value="{{ product.title }}" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category</label>
                                <select class="form-select" name="category_id" required>
                                    <option value="">Select Category</option>
                                    {% for category in categories %}
                                        <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ _(category.name) }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Associated Seller</label>
                                <select class="form-select" name="farmer_id" required>
                                    <option value="">Select Seller</option>
                                    {% for farmer in farmers %}
                                        <option value="{{ farmer.id }}" {% if product.farmer_id == farmer.id %}selected{% endif %}>{{ farmer.full_name }} ({{ farmer.phone }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Price (₹)</label>
                                <input type="number" step="0.01" class="form-control" name="price" value="{{ product.price }}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Available Quantity</label>
                                <input type="number" class="form-control" name="quantity" value="{{ product.quantity }}" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Unit</label>
                                <select class="form-select" name="unit">
                                    <option value="Kg" {% if product.unit == 'Kg' %}selected{% endif %}>Kg</option>
                                    <option value="Quintal" {% if product.unit == 'Quintal' %}selected{% endif %}>Quintal</option>
                                    <option value="Ton" {% if product.unit == 'Ton' %}selected{% endif %}>Ton</option>
                                    <option value="Litre" {% if product.unit == 'Litre' %}selected{% endif %}>Litre</option>
                                    <option value="Piece" {% if product.unit == 'Piece' %}selected{% endif %}>Piece</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Status</label>
                                <select class="form-select" name="status">
                                    <option value="Available" {% if product.status == 'Available' %}selected{% endif %}>Available</option>
                                    <option value="Sold" {% if product.status == 'Sold' %}selected{% endif %}>Sold</option>
                                    <option value="Out of Stock" {% if product.status == 'Out of Stock' %}selected{% endif %}>Out of Stock</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Change Image</label>
                                <input type="file" class="form-control" name="image" accept="image/*">
                            </div>

                            <!-- Allow Bargaining -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Allow Bargaining</label>
                                <select class="form-select" name="allow_bargaining" onchange="toggleMinPrice(this.value)">
                                    <option value="0" {% if not product.allow_bargaining %}selected{% endif %}>No</option>
                                    <option value="1" {% if product.allow_bargaining %}selected{% endif %}>Yes</option>
                                </select>
                            </div>

                            <!-- Minimum Price -->
                            <div class="col-md-6 mb-3" id="minPriceGroup" style="{% if product.allow_bargaining %}display: block;{% else %}display: none;{% endif %}">
                                <label class="form-label fw-semibold">Minimum Acceptable Price (₹)</label>
                                <input type="number"
                                       class="form-control"
                                       id="minPriceInput"
                                       name="min_price"
                                       placeholder="Enter minimum acceptable price"
                                       step="any"
                                       value="{{ product.min_price }}">
                                <div class="form-text text-muted">This price remains private and is never shown to buyers.</div>
                            </div>

                            <script>
                            function toggleMinPrice(val) {
                                const group = document.getElementById('minPriceGroup');
                                const input = document.getElementById('minPriceInput');
                                if (val === '1') {
                                    group.style.display = 'block';
                                    input.setAttribute('required', 'required');
                                } else {
                                    group.style.display = 'none';
                                    input.removeAttribute('required');
                                }
                            }
                            </script>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Product Description</label>
                                <textarea class="form-control" name="description" rows="4">{{ product.description if product.description else '' }}</textarea>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-warning btn-lg px-5">
                                <i class="bi bi-save-fill me-1"></i> Save Changes
                            </button>
                            <a href="{{ url_for('admin.products') }}" class="btn btn-secondary btn-lg px-4 ms-2">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
