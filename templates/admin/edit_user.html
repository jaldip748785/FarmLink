{% extends "base_admin.html" %}

{% block title %}Edit User | Admin | FarmLink{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-warning text-dark py-3 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-pencil-square me-2"></i>
                        Edit User #{{ user.id }} - {{ user.full_name }}
                    </h4>
                    <a href="{{ url_for('admin.users') }}" class="btn btn-outline-dark btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back to Users
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" name="full_name" value="{{ user.full_name }}" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">User Role</label>
                                <select class="form-select" name="role" required>
                                    <option value="farmer" {% if user.role == 'farmer' %}selected{% endif %}>Seller</option>
                                    <option value="buyer" {% if user.role == 'buyer' %}selected{% endif %}>Buyer</option>
                                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Reset Password (Optional)</label>
                                <input type="password" class="form-control" name="password" placeholder="Leave blank to keep existing password">
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-warning btn-lg px-5">
                                <i class="bi bi-save-fill me-1"></i> Save Changes
                            </button>
                            <a href="{{ url_for('admin.users') }}" class="btn btn-secondary btn-lg px-4 ms-2">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
