{% extends "base_admin.html" %}

{% block title %}Add APMC Rate | Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold">Add Daily APMC Rate</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.add_apmc_rate') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Commodity / Product Name</label>
                            <input type="text" class="form-control" name="commodity_name" required placeholder="e.g. Tomato">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="category_id" required>
                                <option value="">Select Category</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}" {% if selected_category_id|string == category.id|string %}selected{% endif %}>{{ _(category.name) }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">APMC Market Name</label>
                            <input type="text" class="form-control" name="market_name" required placeholder="e.g. Rajkot APMC">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">State</label>
                            <input type="text" class="form-control" name="state" placeholder="e.g. Gujarat">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">District</label>
                            <select class="form-select" name="district_id">
                                <option value="">Select District (Optional)</option>
                                {% for dist in districts %}
                                <option value="{{ dist.id }}">{{ dist.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-4">
                            <label class="form-label">Modal Price (Reference)</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" class="form-control" name="modal_price" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Minimum Price</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" class="form-control" name="minimum_price">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Maximum Price</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" class="form-control" name="maximum_price">
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Unit</label>
                            <input type="text" class="form-control" name="unit" value="kg" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Rate Date</label>
                            <input type="date" class="form-control" name="rate_date" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Source</label>
                            <input type="text" class="form-control" name="source" value="AGMARKNET">
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-success px-4">Save Rate</button>
                            <a href="{{ url_for('admin.apmc_rates') }}" class="btn btn-light ms-2">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
