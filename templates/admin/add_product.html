{% extends "base_admin.html" %}

{% block title %}Add Product | Admin | FarmLink{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white py-3 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-plus-circle-fill me-2"></i>
                        Add Product (Admin)
                    </h4>
                    <a href="{{ url_for('admin.products') }}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back to Products
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.add_product') }}" enctype="multipart/form-data">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Product Title / Name</label>
                                <input type="text" class="form-control" name="title" placeholder="Enter product name" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category</label>
                                <select class="form-select" name="category_id" required>
                                    <option value="">Select Category</option>
                                    {% for category in categories %}
                                        <option value="{{ category.id }}">{{ _(category.name) }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Associated Seller</label>
                                <select class="form-select" name="farmer_id" required>
                                    <option value="">Select Seller</option>
                                    {% for farmer in farmers %}
                                        <option value="{{ farmer.id }}">{{ farmer.full_name }} ({{ farmer.phone }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Price (₹)</label>
                                <input type="number" step="0.01" class="form-control" name="price" placeholder="Enter price" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Available Quantity</label>
                                <input type="number" class="form-control" name="quantity" placeholder="Enter quantity" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Unit</label>
                                <select class="form-select" name="unit" required>
                                    <option value="Kg">Kg</option>
                                    <option value="Quintal">Quintal</option>
                                    <option value="Ton">Ton</option>
                                    <option value="Litre">Litre</option>
                                    <option value="Piece">Piece</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Status</label>
                                <select class="form-select" name="status">
                                    <option value="Available">Available</option>
                                    <option value="Out of Stock">Out of Stock</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Product Image</label>
                                <input type="file" class="form-control" name="image" accept="image/*">
                            </div>

                            <!-- Allow Bargaining -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Allow Bargaining</label>
                                <select class="form-select" name="allow_bargaining" onchange="toggleMinPrice(this.value)">
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>

                            <!-- Minimum Price -->
                            <div class="col-md-6 mb-3" id="minPriceGroup" style="display: none;">
                                <label class="form-label fw-semibold">Minimum Acceptable Price (₹)</label>
                                <input type="number"
                                       class="form-control"
                                       id="minPriceInput"
                                       name="min_price"
                                       placeholder="Enter minimum acceptable price"
                                       step="any"
                                       value="0.00">
                                <div class="form-text text-muted">This price remains private and is never shown to buyers.</div>
                            </div>

                            <script>
                            function toggleMinPrice(val) {
                                const group = document.getElementById('minPriceGroup');
                                const input = document.getElementById('minPriceInput');
                                if (val === '1') {
                                    group.style.display = 'block';
                                    input.setAttribute('required', 'required');
                                } else {
                                    group.style.display = 'none';
                                    input.removeAttribute('required');
                                    input.value = '0.00';
                                }
                            }
                            </script>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Product Description</label>
                                <textarea class="form-control" name="description" rows="4" placeholder="Enter product description"></textarea>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-success btn-lg px-5">
                                <i class="bi bi-check-circle-fill me-1"></i> Add Product
                            </button>
                            <a href="{{ url_for('admin.products') }}" class="btn btn-secondary btn-lg px-4 ms-2">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
