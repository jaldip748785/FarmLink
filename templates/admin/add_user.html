{% extends "base_admin.html" %}

{% block title %}Add New User | Admin | FarmLink{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white py-3 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-person-plus-fill me-2"></i>
                        Add New User
                    </h4>
                    <a href="{{ url_for('admin.users') }}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back to Users
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.add_user') }}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" name="full_name" placeholder="Enter full name" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" name="email" placeholder="Enter email address" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" name="password" placeholder="Create password" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">User Role</label>
                                <select class="form-select" name="role" required>
                                    <option value="farmer">Seller</option>
                                    <option value="buyer" selected>Buyer</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-success btn-lg px-5">
                                <i class="bi bi-person-check-fill me-1"></i> Create User
                            </button>
                            <a href="{{ url_for('admin.users') }}" class="btn btn-secondary btn-lg px-4 ms-2">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
