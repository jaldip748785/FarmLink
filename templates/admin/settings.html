{% extends "base_admin.html" %}

{% block title %}Admin Settings | FarmLink{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-gear-fill me-2"></i>
                        Admin Account Settings
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.settings') }}">
                        <!-- Admin Email -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Admin Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope-fill text-success"></i></span>
                                <input type="email"
                                       class="form-control"
                                       name="email"
                                       value="{{ admin_email }}"
                                       required>
                            </div>
                        </div>

                        <hr class="my-4">
                        <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-shield-lock-fill me-2"></i> Change Password</h5>

                        <!-- Current Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Current Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key-fill text-muted"></i></span>
                                <input type="password"
                                       class="form-control"
                                       name="current_password"
                                       placeholder="Enter current password"
                                       required>
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">New Password (Optional)</label>
                                <input type="password"
                                       class="form-control"
                                       name="new_password"
                                       placeholder="Leave blank to keep current">
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold">Confirm New Password</label>
                                <input type="password"
                                       class="form-control"
                                       name="confirm_password"
                                       placeholder="Confirm new password">
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-check-circle-fill me-1"></i> Save Settings
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
