{% extends "base.html" %}

{% block title %}Verify Reset Code | FarmLink{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-success text-white text-center py-4">
                    <h2 class="fw-bold mb-2"><i class="bi bi-key"></i> Enter Reset Code</h2>
                    <p class="mb-0">Check your inbox and enter the 6-digit confirmation code.</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Confirmation Code</label>
                            <input type="text" class="form-control" name="otp_code" placeholder="Enter 6-digit code" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Verify Code</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
