{% extends "base.html" %}

{% block title %}Change Password | FarmLink{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white py-3">
                    <h3 class="mb-0 fw-bold">
                        <i class="bi bi-key-fill"></i>
                        {{ _('change_password') }}
                    </h3>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="/auth/change-password">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ _('current_password') }}</label>
                            <input type="password" class="form-control" name="current_password" placeholder="{{ _('current_password') }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ _('new_password') }}</label>
                            <input type="password" class="form-control" name="new_password" placeholder="{{ _('new_password') }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">{{ _('confirm_new_password') }}</label>
                            <input type="password" class="form-control" name="confirm_password" placeholder="{{ _('confirm_new_password') }}" required>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success btn-lg px-4">
                                <i class="bi bi-check-circle-fill"></i> {{ _('update_password') }}
                            </button>
                            <a href="/auth/profile" class="btn btn-secondary btn-lg px-4 ms-2">{{ _('cancel') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
